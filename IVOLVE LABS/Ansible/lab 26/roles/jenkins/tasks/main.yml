---
- name: Install Jenkins prerequisites and Java 21
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-apt
      - fontconfig
      - openjdk-21-jre
    state: present
    update_cache: true

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Jenkins LTS signing key
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins.asc
    mode: "0644"

- name: Add Jenkins LTS apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/jenkins.asc] https://pkg.jenkins.io/debian-stable binary/"
    filename: jenkins
    state: present
    update_cache: true

- name: Install Jenkins
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: true

- name: Enable and start Jenkins
  ansible.builtin.systemd_service:
    name: jenkins
    enabled: true
    state: started
    daemon_reload: true
